<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>

<body>

    <h1>Formulir Pendaftaran Seminar</h1>

    <form action="" method="post">

        <h2>Data Peserta</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Nama Lengkap</strong>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>NIM</strong>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" />
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk"
                           value="Laki-laki" />
                    <label for="laki">Laki-laki</label>

                    <input type="radio" id="perempuan" name="jk"
                           value="Perempuan" />
                    <label for="perempuan">Perempuan</label>
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Program Studi</strong>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option value="Informatika">Informatika</option>
                        <option value="Sistem Informasi">Sistem Informasi</option>
                        <option value="Teknik Industri">Teknik Industri</option>
                    </select>
                </td>
            </tr>

        </table>


        <h2>Pilihan Seminar</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket"
                           value="Reguler" />
                    <label for="reguler">Reguler</label>

                    <input type="radio" id="vip" name="tiket"
                           value="VIP" />
                    <label for="vip">VIP</label>
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <input type="checkbox" id="web" name="topik"
                           value="Web Development" />
                    <label for="web">Web Development</label>

                    <br />

                    <input type="checkbox" id="data" name="topik"
                           value="Data Science" />
                    <label for="data">Data Science</label>

                    <br />

                    <input type="checkbox" id="ai" name="topik"
                           value="Artificial Intelligence" />
                    <label for="ai">Artificial Intelligence</label>
                </td>
            </tr>

        </table>


        <h2>Informasi Tambahan</h2>

        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse; width:100%;">

            <tr>
                <td style="width:32%;">
                    <strong>Alasan Mengikuti Seminar</strong>
                </td>
                <td>
                    <textarea id="alasan" name="alasan"
                              rows="5" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <strong>Bukti Pembayaran</strong>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <input type="submit" value="Simpan" />
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
